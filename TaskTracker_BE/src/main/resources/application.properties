spring.application.name=Throughline

spring.datasource.url=jdbc:postgresql://localhost:5432/task_tracker_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT — local-dev secret. Rotate this (and invalidate existing tokens) before any real deployment.
app.jwt.secret=4UUka4W7drN4QyLAHkN8jnKgh8ULiMiripMFaZZ6wLYt3HiryeZN6yZIWCbqPpn+WFa81k0hyqNUSMKfK7U6ag==
app.jwt.expiration-ms=86400000

# Mail (Gmail SMTP) — host/port/auth flags are not secret, so they live here; the real
# credentials (spring.mail.username/password) live in the gitignored
# application-secrets.properties, imported optionally so the app still boots without it.
spring.config.import=optional:classpath:application-secrets.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Where the frontend lives — used only to build links inside invite/notification emails.
app.frontend-url=http://localhost:5173
